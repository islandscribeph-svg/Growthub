<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Harem of the Qing</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="touch-pad" class="touch-pad" role="group" aria-label="Walk: press and hold an arrow">
      <span class="touch-pad__arrow touch-pad__arrow--up" data-direction="up" aria-hidden="true">▲</span>
      <span class="touch-pad__arrow touch-pad__arrow--left" data-direction="left" aria-hidden="true">◀</span>
      <span class="touch-pad__arrow touch-pad__arrow--right" data-direction="right" aria-hidden="true">▶</span>
      <span class="touch-pad__arrow touch-pad__arrow--down" data-direction="down" aria-hidden="true">▼</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
